<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelime Defteri — Şifre Sıfırlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--paper); }
  .reset-card { max-width:400px; width:100%; padding:40px 32px; }
  .reset-card h1 { font-size:22px; margin-bottom:8px; }
  .reset-card p { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .reset-card a { color:var(--moss-deep); font-weight:600; text-decoration:none; font-size:14px; }
  .success-icon { font-size:56px; text-align:center; margin-bottom:16px; }
</style>
</head>
<body>
<div class="reset-card">
  <div id="invalid-panel" style="display:none; text-align:center;">
    <div class="success-icon">❌</div>
    <h1>Geçersiz bağlantı</h1>
    <p>Bu bağlantı geçersiz veya süresi dolmuş.</p>
    <a href="/">Giriş sayfasına dön</a>
  </div>

  <div id="reset-form-panel">
    <h1>Yeni şifre belirle</h1>
    <p>En az 8 karakter olmalı.</p>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <form id="reset-form">
      <div class="field">
        <label for="new-password">Yeni şifre</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="field">
        <label for="confirm-password">Şifre tekrar</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Şifremi sıfırla</button>
    </form>
  </div>

  <div id="success-panel" style="display:none; text-align:center;">
    <div class="success-icon">✅</div>
    <h1>Şifren güncellendi</h1>
    <p>Artık yeni şifrenle giriş yapabilirsin.</p>
    <a href="/">Giriş yap</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  const errorBanner = document.getElementById('error-banner');
  const resetFormPanel = document.getElementById('reset-form-panel');
  const successPanel = document.getElementById('success-panel');
  const invalidPanel = document.getElementById('invalid-panel');

  if (!token) {
    resetFormPanel.style.display = 'none';
    invalidPanel.style.display = '';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    errorBanner.classList.remove('visible');
    errorBanner.textContent = '';

    if (password !== confirm) {
      errorBanner.textContent = 'Şifreler eşleşmiyor.';
      errorBanner.classList.add('visible');
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status === 400 && data.error && data.error.includes('Gecersiz')) {
          resetFormPanel.style.display = 'none';
          invalidPanel.style.display = '';
        } else {
          errorBanner.textContent = data.error || 'Bir hata oluştu.';
          errorBanner.classList.add('visible');
        }
        return;
      }
      resetFormPanel.style.display = 'none';
      successPanel.style.display = '';
    } catch (_) {
      errorBanner.textContent = 'Sunucuya ulaşılamadı.';
      errorBanner.classList.add('visible');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
