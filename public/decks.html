<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelime Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/decks.css" />
</head>
<body class="decks-dark">

<nav class="navbar">
  <div class="navbar-brand">
    <a href="/decks.html" class="navbar-home-link">
      <span class="navbar-icon">📚</span>
      <span class="navbar-title">Kelime Defteri</span>
    </a>
  </div>
  <div class="navbar-actions">
    <button class="navbar-user-btn" id="user-name-btn" type="button"></button>
    <button class="navbar-link" id="notes-btn" type="button">Notlarım</button>
    <button class="navbar-link navbar-logout" id="logout-btn" type="button">Çıkış yap</button>
  </div>
</nav>

<main class="decks-page">
  <div id="loading" class="loading-state">Yükleniyor…</div>

  <div id="deck-list-view" style="display:none;">
    <div class="dash-welcome">
      <h1 class="dash-greeting" id="dash-greeting">Selam! 👋</h1>
      <p class="dash-sub">Bugün kelime fethedeceğiz! Hangi seti çalışmak istersin?</p>
    </div>

    <div class="dash-layout">
      <div class="dash-main">
        <div id="deck-grid" class="deck-grid"></div>
      </div>

      <aside class="dash-aside">
        <h2 class="tools-heading">🎮 Oyun Paneli</h2>

        <button class="stat-card" id="profil-btn" type="button">
          <div class="stat-card-top">
            <div class="stat-card-title">Öğrenci Paneli</div>
            <div class="stat-card-sub">İlerleme ve istatistikler</div>
          </div>
          <div class="stat-sparkline" id="stat-sparkline"></div>
        </button>

        <div class="mini-tools-grid">
          <button class="mini-tool-card mini-tool-card--wheel" id="wheel-btn" type="button" style="display:none;">
            <span class="mini-tool-icon">🎁</span>
            <div class="mini-tool-name">Günlük Ödül Çarkı</div>
            <div class="mini-tool-desc" id="wheel-desc">Her 60 saatte bir çevir!</div>
          </button>
          <button class="mini-tool-card mini-tool-card--challenge" id="challenge-btn" type="button" style="display:none;">
            <span class="mini-tool-icon">⚡</span>
            <div class="mini-tool-name">Günlük Mücadele</div>
            <div class="mini-tool-desc" id="challenge-desc">5 soru · 3 dakika</div>
          </button>
        </div>

        <button class="admin-panel-link" id="admin-panel-btn" type="button" style="display:none;">
          <span class="mini-tool-icon">🛠️</span>
          <span>Yönetim Paneli</span>
        </button>

        <div class="leaderboard-section" id="leaderboard-section" style="display:none;">
          <h2 class="tools-heading">🏆 Liderlik Tablosu</h2>
          <div class="leaderboard-grades" id="leaderboard-grades"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="unit-list-view" style="display:none;">
    <button class="back-btn" id="back-to-decks" type="button">
      <span>←</span> Tüm setler
    </button>
    <div id="unit-deck-header" class="unit-deck-header">
      <div id="unit-deck-icon" class="unit-deck-icon"></div>
      <h2 id="unit-deck-title" class="unit-deck-title"></h2>
    </div>
    <div id="unit-mode-tabs" class="unit-mode-tabs" style="display:none;">
      <button class="unit-mode-tab is-active" id="tab-words" type="button">📗 Kelimeler</button>
      <button class="unit-mode-tab" id="tab-topics" type="button">📝 Konu Özetleri</button>
    </div>
    <div id="unit-buttons" class="unit-buttons"></div>
  </div>
</main>

<script src="/js/decks.js"></script>
</body>
</html>
