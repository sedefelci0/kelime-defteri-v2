<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelime Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/decks.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <span class="navbar-icon">📚</span>
    <span class="navbar-title">Kelime Defteri</span>
  </div>
  <div class="navbar-actions">
    <button class="navbar-user-btn" id="user-name-btn" type="button"></button>
    <button class="navbar-link" id="notes-btn" type="button">Notlarım</button>
    <button class="navbar-link navbar-logout" id="logout-btn" type="button">Çıkış yap</button>
  </div>
</nav>

<main class="decks-page">
  <div id="loading" class="loading-state">Yükleniyor…</div>

  <div id="deck-list-view" style="display:none;">
    <h1 class="page-title">Hangi seti çalışmak istersin?</h1>
    <div id="deck-grid" class="deck-grid"></div>

    <div class="tools-section">
      <h2 class="tools-heading">Araçlar</h2>
      <div class="tools-grid">
        <button class="tool-card" id="profil-btn" type="button">
          <span class="tool-icon">📊</span>
          <div class="tool-text">
            <div class="tool-name">Öğrenci Paneli</div>
            <div class="tool-desc">İlerleme ve istatistikler</div>
          </div>
        </button>
        <button class="tool-card tool-card--admin" id="admin-panel-btn" type="button" style="display:none;">
          <span class="tool-icon">🛠️</span>
          <div class="tool-text">
            <div class="tool-name">Yönetim Paneli</div>
            <div class="tool-desc">Öğrenci istatistikleri</div>
          </div>
        </button>
      </div>
    </div>

    <div class="leaderboard-section" id="leaderboard-section" style="display:none;">
      <h2 class="tools-heading">Liderlik Tablosu</h2>
      <p class="leaderboard-sub">Her sınıf seviyesinde en çok doğru yapan ilk 3 öğrenci</p>
      <div class="leaderboard-grades" id="leaderboard-grades"></div>
    </div>
  </div>

  <div id="unit-list-view" style="display:none;">
    <button class="back-btn" id="back-to-decks" type="button">
      <span>←</span> Tüm setler
    </button>
    <div id="unit-deck-header" class="unit-deck-header">
      <div id="unit-deck-icon" class="unit-deck-icon"></div>
      <h2 id="unit-deck-title" class="unit-deck-title"></h2>
    </div>
    <div id="unit-buttons" class="unit-buttons"></div>
  </div>
</main>

<script src="/js/decks.js"></script>
</body>
</html>
