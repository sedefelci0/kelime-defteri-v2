<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelime Defteri — Notlarım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/notes.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand">Kelime Defteri</div>
    <div class="user-area">
      <span class="user-name" id="user-name"></span>
      <button class="btn btn-secondary" id="back-to-decks-btn" type="button">Desteler</button>
      <button class="btn btn-danger-ghost" id="logout-btn" type="button">Çıkış yap</button>
    </div>
  </div>

  <div class="notes-page">
    <div id="list-view" class="list-view">
      <div class="list-header">
        <h2 class="page-title">Notlarım</h2>
        <button class="btn btn-primary add-note-btn" id="add-note-btn" type="button">+ Yeni Not</button>
      </div>
      <div id="loading" class="loading-state">Yükleniyor…</div>
      <div id="empty-notes" class="empty-state" style="display:none;">
        <h2>Henüz not yok</h2>
        <p>"+ Yeni Not" ile ilk notunu oluştur.</p>
      </div>
      <div id="notes-list" class="notes-list"></div>
    </div>

    <div id="editor-view" class="editor-view" style="display:none;">
      <div class="editor-header">
        <button class="btn btn-secondary" id="editor-back-btn" type="button">← Notlarım</button>
        <div class="editor-actions">
          <button class="btn btn-danger-ghost" id="delete-note-btn" type="button" style="display:none;">Sil</button>
          <button class="btn btn-primary" id="save-note-btn" type="button">Kaydet</button>
        </div>
      </div>
      <input type="text" id="note-title" class="note-title-input" placeholder="Başlık (isteğe bağlı)" />
      <textarea id="note-content" class="note-content-area" placeholder="Buraya yazmaya başla…"></textarea>
      <div class="save-status" id="save-status"></div>
    </div>
  </div>
</div>

<script src="/js/notes.js"></script>
</body>
</html>
